name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv run pip install pyinstaller

      - name: Build app
        run: uv run pyinstaller --windowed --name "doc-x-diff" main.py

      - name: Zip app bundle
        run: cd dist && zip -r doc-x-diff-mac.zip "doc-x-diff.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/doc-x-diff-mac.zip
